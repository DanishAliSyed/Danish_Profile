<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 675" role="img" aria-labelledby="title desc">
<title id="title">New Zealand Goods Export Recovery</title>
<desc id="desc">January to August exports in 2019, 2020 and 2021, with commodity contributions to the 2021 change versus 2019.</desc>
<rect x="0" y="0" width="1100" height="675" rx="0" fill="#eef4f6"/>
<rect x="0" y="0" width="1100" height="143" rx="0" fill="#142f43"/>
<text x="34" y="32" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#87e0ce" font-weight="700">PORTFOLIO CASE STUDY  /  SUPPLY CHAIN ANALYTICS</text>
<text x="34" y="76" font-family="DejaVu Sans,Arial,sans-serif" font-size="38" fill="#ffffff" font-weight="700">New Zealand Goods Export Recovery</text>
<text x="34" y="113" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#d8eaf4" font-weight="400">January–August comparison  |  2019 baseline  |  NZD, nominal</text>
<rect x="34" y="160" width="334" height="78" rx="10" fill="#ffffff"/>
<text x="49" y="184" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#45647a" font-weight="700">2019 goods exports</text>
<text x="49" y="218" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" fill="#173448" font-weight="700">NZ$39.83B</text>
<rect x="383" y="160" width="334" height="78" rx="10" fill="#ffffff"/>
<text x="398" y="184" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#45647a" font-weight="700">2020 goods exports</text>
<text x="398" y="218" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" fill="#173448" font-weight="700">NZ$40.41B</text>
<rect x="732" y="160" width="334" height="78" rx="10" fill="#ffffff"/>
<text x="747" y="184" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#45647a" font-weight="700">2021 goods exports</text>
<text x="747" y="218" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" fill="#173448" font-weight="700">NZ$41.75B</text>
<rect x="34" y="256" width="1032" height="296" rx="10" fill="#ffffff"/>
<text x="51" y="285" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#173448" font-weight="700">What drove the change from 2019 to 2021?</text>
<text x="51" y="308" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#45647a" font-weight="400">Change in export value, NZ$ millions  |  each commodity at the national level</text>
<rect x="590" y="325" width="1" height="212" rx="0" fill="#b7cad6"/>
<text x="51" y="343" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#173448" font-weight="700">Milk powder, butter, and cheese</text>
