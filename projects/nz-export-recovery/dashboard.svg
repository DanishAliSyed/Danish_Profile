<text x="51" y="403" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#173448" font-weight="700">Logs, wood, and wood articles</text>
<rect x="590" y="391" width="164.1778697001034" height="14" rx="3" fill="#147d74"/>
<text x="966" y="403" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#173448" font-weight="700">+441M</text>
<text x="51" y="433" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#173448" font-weight="700">Fruit</text>
<rect x="590" y="421" width="139.23474663908996" height="14" rx="3" fill="#147d74"/>
<text x="966" y="433" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#173448" font-weight="700">+374M</text>
