<text x="51" y="593" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#173448" font-weight="700">2021 vs 2019: +1.92B NZD (+4.8%)</text>
<text x="51" y="614" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#173448" font-weight="400">Commodity movements are uneven. Nominal values combine price and volume effects.</text>
<text x="34" y="655" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#45647a" font-weight="400">Danish Syed  /  Source: Stats NZ, Effects of COVID-19 on trade, 1 September 2021 (provisional)</text>
