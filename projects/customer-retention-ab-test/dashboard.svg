<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 625" role="img" aria-labelledby="title desc">
<title id="title">Renewal Reminder A/B Test</title>
<desc id="desc">Synthetic retention experiment: 60 percent control renewal, 64.5 percent reminder renewal, and a 4.5 percentage point lift with a confidence interval that crosses the 2 point rollout threshold.</desc>
<rect x="0" y="0" width="1000" height="625" rx="0" fill="#eef4f7"/>
<rect x="0" y="0" width="1000" height="150" rx="0" fill="#142e43"/>
<text x="34" y="34" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#89e0cf" font-weight="700">PRODUCT ANALYTICS  /  SYNTHETIC EXPERIMENT</text>
<text x="34" y="81" font-family="DejaVu Sans,Arial,sans-serif" font-size="33" fill="#ffffff" font-weight="700">Does a renewal reminder improve retention?</text>
<text x="34" y="118" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#d6e7f2" font-weight="400">Primary outcome: renewed by 30 days after the scheduled expiry date</text>
<rect x="34" y="169" width="300" height="90" rx="10" fill="#ffffff"/>
<text x="48" y="193" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#426278" font-weight="700">Control</text>
<text x="48" y="223" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#183247" font-weight="700">60.0%</text>
<text x="48" y="246" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#426278" font-weight="400">1,440 renewals / 2,400 assigned</text>
<rect x="346" y="169" width="300" height="90" rx="10" fill="#ffffff"/>
<text x="360" y="193" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#426278" font-weight="700">Reminder</text>
<text x="360" y="223" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#183247" font-weight="700">64.5%</text>
<text x="360" y="246" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#426278" font-weight="400">1,548 renewals / 2,400 assigned</text>
<rect x="658" y="169" width="308" height="90" rx="10" fill="#ffffff"/>
<text x="672" y="193" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#426278" font-weight="700">Absolute lift</text>
<text x="672" y="223" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#183247" font-weight="700">+4.5 pp</text>
<text x="672" y="246" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#426278" font-weight="400">Reminder minus control</text>
<rect x="34" y="278" width="932" height="192" rx="10" fill="#ffffff"/>
<text x="51" y="308" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#183247" font-weight="700">The lift is positive, but the rollout bar is still in doubt</text>
<text x="51" y="331" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#426278" font-weight="400">Estimated lift with 95% confidence interval  |  percentage points</text>
<line x1="87" y1="410" x2="887" y2="410" stroke="#9fb3c4" stroke-width="1"/>
<line x1="87" y1="406" x2="87" y2="416" stroke="#9fb3c4" stroke-width="1"/>
<text x="81" y="436" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#426278" font-weight="400">0</text>
<line x1="287" y1="406" x2="287" y2="416" stroke="#9fb3c4" stroke-width="1"/>
<text x="281" y="436" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#426278" font-weight="400">2</text>
<line x1="487" y1="406" x2="487" y2="416" stroke="#9fb3c4" stroke-width="1"/>
<text x="481" y="436" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#426278" font-weight="400">4</text>
<line x1="687" y1="406" x2="687" y2="416" stroke="#9fb3c4" stroke-width="1"/>
<text x="681" y="436" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#426278" font-weight="400">6</text>
<line x1="887" y1="406" x2="887" y2="416" stroke="#9fb3c4" stroke-width="1"/>
<text x="881" y="436" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#426278" font-weight="400">8</text>
<line x1="287" y1="358" x2="287" y2="410" stroke="#b05235" stroke-width="2"/>
<text x="295" y="367" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#9b432c" font-weight="700">+2 pp rollout threshold</text>
<line x1="263.0209747660856" y1="389" x2="810.9790252339152" y2="389" stroke="#167c72" stroke-width="5"/>
<line x1="263.0209747660856" y1="382" x2="263.0209747660856" y2="397" stroke="#167c72" stroke-width="2"/>
<line x1="810.9790252339152" y1="382" x2="810.9790252339152" y2="397" stroke="#167c72" stroke-width="2"/>
<circle cx="537.0000000000003" cy="389" r="7" fill="#167c72"/>
<text x="51" y="457" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#426278" font-weight="700">95% CI: +1.76 to +7.24 pp</text>
<rect x="34" y="488" width="932" height="92" rx="10" fill="#daedef"/>
<text x="51" y="517" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#183247" font-weight="700">Decision: run a confirmatory test before a full rollout</text>
<text x="51" y="542" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#183247" font-weight="400">The lower bound is below +2 pp. Measure opt-outs and complaints in the next test.</text>
<text x="51" y="562" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#426278" font-weight="400">These are simulated outcomes, not evidence about a real campaign.</text>
<text x="34" y="605" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#426278" font-weight="400">Danish Syed  /  SQL &amp; Python  /  Synthetic data</text>
</svg>
